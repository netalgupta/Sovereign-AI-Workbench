# models.yaml — Model Registry (dev tier, RTX 4060 8GB)
# Exact shape per VIBECODING_SPEC.md CARD 01 / DEPENDENCIES.md §1.
# Adding a model = adding an entry here + backend reload. No code change (FR-4).
# Do not add fields beyond id/backend/model/task_tags without updating
# CARD 01's ModelConfig schema, this file, and TOOLS.md in the same change.

- id: coder-model
  backend: ollama
  model: qwen2.5-coder:7b
  task_tags: [code_generation, code_review, debugging]

- id: reasoning-model
  backend: ollama
  model: qwen2.5:14b
  task_tags: [summarization, drafting, approval_notes, planning]

- id: vision-model
  backend: ollama
  model: qwen2.5vl:7b
  task_tags: [ocr, image_understanding, diagram_reading]

- id: fast-router
  backend: ollama
  # Was "phi-3.5-mini", which DOES NOT EXIST on Ollama:
  #   ollama pull phi-3.5-mini
  #   Error: pull model manifest: file does not exist
  # So fast-router had never worked. Both the router (CARD 03) and the
  # self-verification agent (AGENTS_SPEC §5) resolve to this id, and both
  # 404'd on every call -- which is why verification reported "could not
  # run" rather than a verdict. The real tag is phi3.5 (2.2 GB, 3.8B).
  # Same bug class as qwen2-vl:7b -> qwen2.5vl:7b, found earlier: a
  # plausible-looking name that was never actually pulled.
  model: phi3.5
  task_tags: [classification, routing]
