[pytest]

markers =
    live_model: calls a real model through Ollama, or loads a large model from disk.
        These are ~10 tests and they are two thirds of the suite's wall time.
        They are NOT optional -- they are the ones that catch a model tag that
        does not exist, a prompt the model stops parsing, and an OCR pipeline
        that silently falls back to CPU. Every one of those has happened here.

        Fast loop while iterating:
            py -3 -m pytest backend/tests -q -m "not live_model"

        Before committing or pushing, always the whole thing:
            py -3 -m pytest backend/tests -q
